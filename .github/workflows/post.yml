# 毎日、開店時刻にOPEN告知ストーリーを流す
# 時間は世界標準時（UTC）で書く。日本時間 = UTC + 9時間
# GitHubの起動は40分以上遅れることがある（2026-11-07 実際に約45分遅れ）ので、
# 開店の70分・50分・30分前に起動して、開店時刻まで待ってから流す。2回目以降は「もう流していれば何もしない」
name: OPEN告知ストーリー（イッツ）

on:
  schedule:
    - cron: "50 6 * * 1-5"   # 月〜金 15:50（日本時間）起動 → 17:00に流す
    - cron: "10 7 * * 1-5"   # 月〜金 16:10 予備
    - cron: "30 7 * * 1-5"   # 月〜金 16:30 予備
    - cron: "50 4 * * 0,6"   # 土日 13:50（日本時間）起動 → 15:00に流す
    - cron: "10 5 * * 0,6"   # 土日 14:10 予備
    - cron: "30 5 * * 0,6"   # 土日 14:30 予備
  workflow_dispatch:          # 手で動かすボタン（テスト用）
    inputs:
      mode:
        description: "dry=テスト（つながない）／check=確認（投稿しない）／live=本番（流す）"
        type: choice
        options: [dry, check, live]
        default: dry
      day:
        description: "曜日（空なら今日）例：月"
        required: false
        default: ""

permissions:
  contents: write   # 記録ファイル（state/posted.json）を保存するため

concurrency:
  group: open-story
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 最新の記録を受け取る
        # 予備の起動は、前の起動が終わるまで順番待ちになる。その間に前の起動が記録を書き足すので、
        # 受け取り直さないと「今日はまだ流していない」と思って2回流してしまう（2026-11-14 実際に起きた）
        run: git pull -q origin main
      - name: ストーリーを流す
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # 手で動かした時は選んだモード。毎日の自動は、設定の変数 POST_MODE（無ければテスト）
          POST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || vars.POST_MODE || 'dry' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          DAY: ${{ inputs.day }}
        run: |
          ARGS=""
          if [ "$MANUAL" = "true" ]; then ARGS="--manual"; fi
          if [ -n "$DAY" ]; then ARGS="$ARGS --day $DAY"; fi
          python post_story.py $ARGS
      - name: 記録を保存
        if: always()
        run: |
          git config user.name "open-story-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/posted.json
          if ! git diff --cached --quiet; then
            git commit -m "ストーリーの記録を更新（イッツ）"
            git pull --rebase -q
            git push
          fi
